openapi: 3.0.3
info:
  title: Accounting Integration API
  version: 1.0.0
  description: |
    Two-way sync between this ERP's Accounting module and external books.
    Setup guide: README.md. Every request needs a bearer token and an X-Tenant header.
servers:
  - url: https://{host}/api/v1/accounting/integrations
    variables:
      host:
        default: erp.example.com
security:
  - bearer: []
tags:
  - name: Connections
  - name: Sync
  - name: Conflicts
  - name: Tally
paths:
  /connections:
    get:
      tags: [Connections]
      summary: List connections
      description: "Permission: accounting.integrations.view"
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: Paginated connections }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Connections]
      summary: Create a connection
      description: "Permission: accounting.integrations.manage"
      parameters: [{ $ref: '#/components/parameters/Tenant' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConnectionInput'
                - type: object
                  required: [name, product]
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}:
    parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
    get:
      tags: [Connections]
      summary: Show a connection
      description: "Permission: accounting.integrations.view"
      responses:
        '200': { description: The connection }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Connections]
      summary: Update or pause a connection
      description: "Permission: accounting.integrations.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConnectionInput'
                - type: object
                  properties:
                    status: { type: string, enum: [active, paused] }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Connections]
      summary: Remove a connection
      description: "Permission: accounting.integrations.manage. Posted journals are not affected."
      responses:
        '200': { description: Removed }
  /connections/{connection}/tokens:
    post:
      tags: [Connections]
      summary: Mint a connector token
      description: |
        Permission: accounting.integrations.manage. The token acts as the caller, works for this
        connection only, and is refused outside this API. It is shown once.
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '201': { description: "data: { id, token }" }
  /connections/{connection}/tokens/{token}:
    delete:
      tags: [Connections]
      summary: Revoke one of your connector tokens
      description: "Permission: accounting.integrations.manage"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: token, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{connection}/mappings:
    parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
    get:
      tags: [Connections]
      summary: List external ID mappings
      description: "Permission: accounting.integrations.view"
      parameters:
        - { name: entity_type, in: query, schema: { $ref: '#/components/schemas/EntityType' } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Paginated mappings }
    post:
      tags: [Connections]
      summary: Map an external ledger or group to a local one
      description: "Permission: accounting.integrations.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, external_id, local_id]
              properties:
                entity_type: { type: string, enum: [ledger, ledger_group] }
                external_id: { type: string, maxLength: 191 }
                external_name: { type: string, maxLength: 255 }
                local_id: { type: integer }
      responses:
        '200': { description: Saved }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/{entity}/batch:
    post:
      tags: [Sync]
      summary: Send records into the ERP
      description: |
        Permission: accounting.integrations.sync. Send ledger groups, then ledgers, then vouchers.
        One bad record doesn't stop the others, so read each record's outcome.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { $ref: '#/components/parameters/Entity' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 191 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/Voucher'
                      - $ref: '#/components/schemas/Ledger'
                      - $ref: '#/components/schemas/LedgerGroup'
      responses:
        '201':
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Batch' }
        '200':
          description: "Replay of an earlier request. Header X-Idempotent-Replay: true"
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /connections/{connection}/feed/{entity}:
    get:
      tags: [Sync]
      summary: Read what this connection hasn't received
      description: |
        Permission: accounting.integrations.view. Records stay here until acknowledged. Excludes records
        that came in through this connection, journals awaiting approval, opening balances and year-end closing entries.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { $ref: '#/components/parameters/Entity' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Pending records }
  /connections/{connection}/feed/{entity}/ack:
    post:
      tags: [Sync]
      summary: Confirm records were stored
      description: "Permission: accounting.integrations.sync"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { $ref: '#/components/parameters/Entity' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [local_id]
                    properties:
                      local_id: { type: integer }
                      external_id: { type: string, maxLength: 191 }
                      external_name: { type: string, maxLength: 255 }
      responses:
        '200': { description: "data: { acknowledged }" }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/batches:
    get:
      tags: [Sync]
      summary: Read the sync log
      description: "Permission: accounting.integrations.view"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: status, in: query, schema: { type: string, enum: [processing, completed, completed_with_issues] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: "Paginated batches, newest first" }
  /connections/{connection}/batches/{batch}:
    get:
      tags: [Sync]
      summary: Read one batch with its records
      description: "Permission: accounting.integrations.view"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { $ref: '#/components/parameters/BatchId' }
      responses:
        '200': { description: The batch }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{connection}/batches/{batch}/retry:
    post:
      tags: [Sync]
      summary: Retry a batch's failed records
      description: "Permission: accounting.integrations.sync. Inbound batches only."
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { $ref: '#/components/parameters/BatchId' }
      responses:
        '200': { description: The batch after retrying }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/conflicts:
    get:
      tags: [Conflicts]
      summary: List conflicts
      description: "Permission: accounting.integrations.view"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved], default: open } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Paginated conflicts }
  /connections/{connection}/conflicts/{conflict}/resolve:
    post:
      tags: [Conflicts]
      summary: Decide a conflict
      description: "Permission: accounting.integrations.resolve"
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: conflict, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, enum: [apply_incoming, keep_local] }
      responses:
        '200': { description: Resolved }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/tally/sync:
    post:
      tags: [Tally]
      summary: Queue a sync cycle
      description: "Permission: accounting.integrations.sync. Queues nothing while the previous cycle has open jobs."
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                direction: { type: string, enum: [both, inbound, outbound] }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '200': { description: "data: { jobs_queued }" }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/tally/retry-pushes:
    post:
      tags: [Tally]
      summary: Let failed pushes go again next cycle
      description: "Permission: accounting.integrations.sync"
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
      responses:
        '200': { description: "data: { released }" }
  /connections/{connection}/tally/agent/poll:
    post:
      tags: [Tally]
      summary: "Relay: fetch the next jobs"
      description: |
        Permission: accounting.integrations.sync. Records the relay as alive, starts a cycle when one is due,
        and leases jobs for five minutes. A job not reported back returns to the queue, up to three attempts.
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
                agent_version: { type: string, maxLength: 40 }
      responses:
        '200':
          description: "data: array of { id, kind, request_xml }"
  /connections/{connection}/tally/agent/jobs/{job}/result:
    post:
      tags: [Tally]
      summary: "Relay: report what Tally said"
      description: |
        Permission: accounting.integrations.sync. Send response_body if Tally answered, even with an error.
        Send transport_error only if Tally could not be reached. A repeated report is ignored.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: job, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response_body: { type: string }
                transport_error: { type: string, maxLength: 2000 }
      responses:
        '200': { description: "data: { status, detail }" }
  /connections/{connection}/tally/import-file:
    post:
      tags: [Tally]
      summary: Upload a Tally XML export
      description: "Permission: accounting.integrations.sync. For a site without the relay."
      parameters: [{ $ref: '#/components/parameters/Tenant' }, { $ref: '#/components/parameters/Connection' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entity, file]
              properties:
                entity: { type: string, enum: [ledger-groups, ledgers, vouchers] }
                file: { type: string, format: binary }
      responses:
        '201': { description: The batch }
        '422': { $ref: '#/components/responses/Error' }
  /connections/{connection}/tally/export-file:
    get:
      tags: [Tally]
      summary: Download XML to import into Tally
      description: |
        Permission: accounting.integrations.sync. Ledgers are marked sent straight away. Vouchers stay pending
        until confirmed with feed/vouchers/ack, using the ids in the X-Accounting-Local-Ids header.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Connection' }
        - { name: entity, in: query, required: true, schema: { type: string, enum: [ledgers, vouchers] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Tally XML
          content:
            application/xml:
              schema: { type: string }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Tenant: { name: X-Tenant, in: header, required: true, schema: { type: string }, description: The tenant's slug }
    Connection: { name: connection, in: path, required: true, schema: { type: integer } }
    BatchId: { name: batch, in: path, required: true, schema: { type: integer } }
    Entity: { name: entity, in: path, required: true, schema: { type: string, enum: [ledger-groups, ledgers, vouchers] } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    Error:
      description: Refused
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string }
  schemas:
    EntityType: { type: string, enum: [ledger_group, ledger, voucher] }
    ConnectionInput:
      type: object
      properties:
        name: { type: string, maxLength: 191 }
        product: { type: string, enum: [tally, custom] }
        external_company: { type: string, description: Exact company name in Tally }
        company_id: { type: integer, nullable: true }
        branch_id: { type: integer, nullable: true }
        settings:
          type: object
          properties:
            direction: { type: string, enum: [both, inbound, outbound] }
            sync_from: { type: string, format: date }
            export_from: { type: string, format: date }
            rescan_days: { type: integer, minimum: 1, maximum: 400 }
            auto_sync_minutes: { type: integer, minimum: 0, maximum: 1440 }
            voucher_type_map:
              type: object
              additionalProperties: { type: string }
            voucher_entries_tag: { type: string, enum: [LEDGERENTRIES.LIST, ALLLEDGERENTRIES.LIST] }
    LedgerGroup:
      type: object
      required: [external_id, name]
      properties:
        external_id: { type: string, maxLength: 191 }
        name: { type: string }
        parent_name: { type: string, nullable: true }
        nature: { type: string, enum: [asset, liability, equity, income, expense], description: Required when creating }
    Ledger:
      type: object
      required: [external_id, name]
      properties:
        external_id: { type: string, maxLength: 191 }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense], description: Required when creating }
        subtype: { type: string }
        group_name: { type: string }
        is_cash_or_bank: { type: boolean }
        is_active: { type: boolean, default: true }
    VoucherLine:
      type: object
      description: Identify the ledger with one of ledger_external_id, ledger_name or account_code.
      properties:
        ledger_external_id: { type: string }
        ledger_name: { type: string }
        account_code: { type: string }
        debit: { type: number }
        credit: { type: number }
        description: { type: string }
    Voucher:
      type: object
      required: [external_id]
      description: To cancel, send only external_id and is_cancelled. Otherwise voucher_type, date and at least two balanced lines are required.
      properties:
        external_id: { type: string, maxLength: 191, description: Stable ID. This is what prevents duplicates }
        voucher_type: { type: string, enum: [payment, receipt, contra, journal, sales, purchase, credit_note, debit_note] }
        date: { type: string, format: date }
        number: { type: string }
        narration: { type: string }
        party_name: { type: string }
        is_cancelled: { type: boolean }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/VoucherLine' }
    Record:
      type: object
      properties:
        external_id: { type: string }
        local_type: { type: string }
        local_id: { type: integer }
        outcome: { type: string, enum: [created, updated, unchanged, pending_approval, failed, conflict] }
        error_code: { type: string, nullable: true }
        error: { type: string, nullable: true }
        attempts: { type: integer }
    Batch:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [processing, completed, completed_with_issues] }
        total: { type: integer }
        created_count: { type: integer }
        updated_count: { type: integer }
        unchanged_count: { type: integer }
        pending_approval_count: { type: integer }
        failed_count: { type: integer }
        conflict_count: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/Record' }
